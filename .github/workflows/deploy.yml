# Publishes the directory to GitHub Pages whenever the main branch changes.
#
# One-time setup: in the repository, go to Settings → Pages and set
# "Source" to "GitHub Actions". Nothing else is needed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check the listings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate groups.json against the schema
        run: python3 scripts/csv_to_json.py --check
      - name: Check colour contrast
        run: python3 scripts/check_contrast.py
      - name: Check that every referenced file exists
        run: python3 scripts/check_links.py --local

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
